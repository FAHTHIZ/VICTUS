name: VICTUS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # weekly: new advisories against unchanged pins
permissions:
  contents: read
# A newer push to the same ref supersedes an in-flight run (main previously queued 1 h runs behind
# each other and macOS jobs were cancelled by the runner limit instead).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  LINUX_DEPS: >-
    ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev
    libdecor-0-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev libudev-dev
    mesa-vulkan-drivers libvulkan1 xvfb
jobs:
  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generated shader library matches sources
        run: python3 tools/shaders/compile_shaders.py --check

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pins, hashes and license table match cmake/VictusDependencies.cmake
        run: python3 tools/deps/victus_deps.py check
      - name: Known vulnerabilities (OSV)
        run: python3 tools/deps/victus_deps.py osv
      - name: CycloneDX SBOM
        run: python3 tools/deps/victus_deps.py sbom --out victus-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: victus-sbom.cdx.json

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVICTUS_BUILD_TESTS=ON -DVICTUS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        shell: bash
        run: |
          # Linux runners have Mesa lavapipe (software Vulkan): GPU tests must run there.
          if [ "$RUNNER_OS" = "Linux" ]; then export VICTUS_REQUIRE_GPU=1 SDL_VIDEO_DRIVER=offscreen; fi
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: GPU backend report
        shell: bash
        run: |
          exe=build/bin/victus_gpu_tests; [ -f "$exe" ] || exe=build/bin/${{ matrix.build_type }}/victus_gpu_tests
          "$exe" | grep '\[victus\]' || true
      - name: Windowed swapchain smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/bin/victus_render_showcase --frames 20 --screenshot build/showcase.png --width 640 --height 360
      - name: Editor and player smoke test
        if: runner.os == 'Linux'
        run: |
          ./build/bin/victus new build/smoke3d --template 3d
          xvfb-run -a ./build/bin/victus_editor build/smoke3d --data-dir build/editor-data --frames 30 --width 1280 --height 720 --screenshot build/editor.png
          xvfb-run -a ./build/bin/victus run build/smoke3d --frames 30 --screenshot build/player.png
      - name: Upload rendered images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renders-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/test_output/*.png
            build/showcase.png
            build/editor.png
            build/player.png
            build/test_output/cli_smoke/*.png
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;29.0.14206865"
      - name: Host CLI (exports the game)
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DVICTUS_BUILD_TESTS=OFF -DVICTUS_BUILD_SAMPLES=OFF -DVICTUS_BUILD_BENCHMARKS=OFF
          cmake --build build-host --target victus_cli --parallel
      - name: Export the 3D template
        run: |
          build-host/bin/victus new build-host/android3d --template 3d --name "Android 3D"
          build-host/bin/victus export build-host/android3d --out build-host/android3d-export --name android3d
      - name: Build the APK
        run: gradle -p platforms/android assembleDebug -Pvictus.game=$PWD/build-host/android3d-export -Pvictus.appName="VICTUS 3D"
      - name: Check the APK
        run: tools/android/check_apk.sh platforms/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: android-3d-template-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["address,undefined", "thread"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVICTUS_SANITIZE=${{ matrix.sanitize }} -DVICTUS_BUILD_BENCHMARKS=OFF -DVICTUS_BUILD_SAMPLES=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: |
          # The Mesa driver itself is not sanitizer-instrumented; GPU tests run in the main matrix.
          export VICTUS_NO_GPU=1
          ctest --test-dir build --output-on-failure
