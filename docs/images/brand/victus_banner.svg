  <text x="100" y="318" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="17" fill="#7dd3fc" fill-opacity="0.85" letter-spacing="1.5">PBR · BAKED GI · PHYSICS · ANIMATION · AI · LUAU · MULTIPLAYER · STUDIO</text>
